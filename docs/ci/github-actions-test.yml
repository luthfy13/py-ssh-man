# GitHub Actions: unit tests on Linux, Windows and macOS (SPEC §11.12, task 9.4, COULD).
#
# NOT ACTIVE: GitHub only runs workflows stored in .github/workflows/. To enable it, move this
# file to .github/workflows/test.yml (SPEC §10.5: workflow files are pushed only with the
# owner's explicit permission). Integration tests are excluded (no SSH test server in CI).
name: test

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 fonts-dejavu-core
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit tests
        run: pytest -q -m "not integration"
